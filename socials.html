<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Socials | Gian's Detailing</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="icon" type="image/x-icon" href="assets/logos/favicon.ico">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <section class="socials-page">

        <div class="socials-card">

            <img src="assets/logos/header-logo.png" class="hero-logo mb-4" alt="Gian's Detailing Logo">


            <div class="section-tag">
                FOLLOW OUR WORK
            </div>


            <h1 class="section-title">
                See The Transformations
            </h1>


            <p class="section-text mb-5">
                Check out our latest details, before & after transformations,
                and customer vehicles across our social platforms.
            </p>


            <div class="d-flex flex-column gap-3">


                <a href="https://www.instagram.com/giansdetailing" target="_blank"
                    class="btn btn-outline-light social-btn instagram-btn">

                    <i class="bi bi-instagram"></i>
                    Instagram
                </a>



                <a href="https://www.tiktok.com/@giansdetailing" target="_blank"
                    class="btn btn-outline-light social-btn tiktok-btn">

                    <i class="bi bi-tiktok"></i>
                    TikTok
                </a>



                <a href="https://www.facebook.com/people/Gians-Detailing/61577704048376/" target="_blank"
                    class="btn btn-outline-light social-btn facebook-btn">

                    <i class="bi bi-facebook"></i>
                    Facebook
                </a>


            </div>


            <a href="index.html" class="btn btn-primary mt-5 hero-btn">
                <i class="bi bi-arrow-left"></i>
                Back
            </a>


        </div>

    </section>


</body>

</html>
